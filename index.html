<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nestly</title>
<meta name="description" content="Nestly: communities, posts, votes and comments. Works on phone, tablet and laptop.">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff6a2b">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e1113;--card:#161a1d;--line:#2a3035;--text:#e8ecef;--mut:#8a949c;--acc:#ff6a2b;--up:#ff6a2b;--down:#6a8cff;--hov:#1e2327;--input:#0e1113}
:root[data-theme=light]{--bg:#e9edf0;--card:#fff;--line:#d5dbe0;--text:#1a1d20;--mut:#667078;--hov:#f2f5f7;--input:#f6f8fa}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px}
.muted{color:var(--mut)}.center{text-align:center}
#top{position:sticky;top:0;z-index:30;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
#burger{display:none;font-size:22px;padding:4px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo img{width:30px;height:30px;border-radius:8px}
#sf{flex:1;max-width:560px}
#sf input{border-radius:999px;padding:8px 16px;background:var(--hov)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;border:0;white-space:nowrap}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.btn.wide{width:100%;margin-top:10px}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.danger{background:#d93a3a}
#who{display:flex;align-items:center;gap:8px;margin-left:auto}
#who .nm{display:flex;align-items:center;gap:6px;font-weight:600}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
#wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:16px;align-items:start}
#nav,#side{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px}
#nav a,#nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
#nav a:hover,#nav button:hover{background:var(--hov);text-decoration:none}
#nav a.on{background:var(--hov);font-weight:700}
#nav h4{margin:14px 10px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.cdot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.sorts{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.post{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.post:hover{border-color:#3b434a}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;width:48px;background:rgba(127,127,127,.07);flex:none}
.votes button,.cvote button{font-size:17px;line-height:1;color:var(--mut);padding:4px 8px;border-radius:6px}
.votes button:hover,.cvote button:hover{background:var(--hov)}
.votes[data-my="1"] .up,.cvote[data-my="1"] .up{color:var(--up)}
.votes[data-my="-1"] .down,.cvote[data-my="-1"] .down{color:var(--down)}
.votes[data-my="1"] .sc,.cvote[data-my="1"] .sc{color:var(--up)}
.votes[data-my="-1"] .sc,.cvote[data-my="-1"] .sc{color:var(--down)}
.sc{font-weight:800;font-size:14px}
.pbody{padding:10px 14px 8px 12px;min-width:0;flex:1}
.meta{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.meta a.c{color:var(--text);font-weight:700}
.post h3{margin:5px 0;font-size:18px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
.snip{color:var(--mut);margin:4px 0 6px;overflow-wrap:anywhere}
.pimg img{display:block;max-width:100%;max-height:520px;border-radius:10px;margin:8px 0;background:#000}
.plink{display:inline-block;margin:4px 0;color:var(--down);font-size:14px;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.acts a,.acts button{padding:5px 9px;border-radius:6px;color:var(--mut);font-weight:600;font-size:13px}
.acts a:hover,.acts button:hover{background:var(--hov);text-decoration:none}
.acts .on{color:var(--acc)}
.body{overflow-wrap:anywhere}.body p{margin:6px 0}.body ul{margin:6px 0;padding-left:22px}
.body blockquote{margin:6px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--mut)}
.body code{background:var(--hov);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:13.5px}
.body a{color:var(--down);text-decoration:underline}
.cm{display:flex;gap:6px;margin-top:10px}
.cvote{display:flex;flex-direction:column;align-items:center;width:30px;flex:none}
.cvote button{font-size:13px;padding:1px 6px}.cvote .sc{font-size:12px}
.cmain{flex:1;min-width:0}
.cmeta{font-size:12.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cmeta a.u{color:var(--text);font-weight:700}
.cact{display:flex;gap:2px;margin-top:2px}
.cact button{padding:3px 8px;font-size:12.5px;color:var(--mut);font-weight:600;border-radius:6px}
.cact button:hover{background:var(--hov)}
.kids{margin-left:2px;padding-left:12px;border-left:2px solid var(--line)}
.kids.flat{margin-left:0;padding-left:0;border-left:0}
.cm.folded>.cmain>.cbody,.cm.folded>.cmain>.cact,.cm.folded>.cmain>.kids,.cm.folded>.cmain>.reply{display:none}
.cm.folded>.cvote{visibility:hidden}
.banner{height:80px;border-radius:12px 12px 0 0;margin:-14px -14px 10px}
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chead .cdot{width:64px;height:64px;font-size:26px;border:4px solid var(--card);margin-top:-30px}
.chead .grow{flex:1;min-width:150px}
.prof{display:flex;gap:14px;align-items:center}
label{font-weight:600;display:block;margin:10px 0 4px}
.row{margin:10px 0}
.tabs{display:flex;gap:4px;margin:10px 0}
.err{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:6px}
.hint{font-size:13px;color:var(--mut)}
#modal{display:none}#modal.on{display:block}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
.box h3{margin:0 0 6px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#222a30;color:#fff;border:1px solid #3b454d;padding:10px 18px;border-radius:999px;z-index:200;transition:transform .25s;max-width:90vw;font-weight:600;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
.side-c{display:flex;align-items:center;gap:10px;padding:6px 0}
.side-c .grow{flex:1;min-width:0}
.steps{padding-left:20px;font-size:14px}.steps li{margin:4px 0}
details summary{cursor:pointer;font-weight:700;margin:8px 0}
img.pv{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px}
@media(max-width:1000px){#wrap{grid-template-columns:210px minmax(0,1fr)}#side{display:none}}
@media(max-width:760px){
 #wrap{display:block;padding:10px}#burger{display:block}
 #nav{position:fixed;z-index:50;left:0;top:54px;bottom:0;width:260px;max-height:none;background:var(--card);border-right:1px solid var(--line);padding:10px;transform:translateX(-105%);transition:transform .2s}
 #nav.open{transform:none}
 .logo span{display:none}#sf{min-width:0}
 #who .nm span{display:none}.btn{padding:8px 12px}
 .post h3{font-size:16.5px}
 .votes{width:40px}
}
</style></head><body>
<header id="top">
  <button id="burger" aria-label="Menu">☰</button>
  <a href="#/" class="logo"><img src="icon-192.png" alt=""><span>Nestly</span></a>
  <form id="sf"><input id="q" type="search" placeholder="Search Nestly" autocomplete="off" aria-label="Search"></form>
  <a class="btn" href="#/submit" id="newpost">＋ Post</a>
  <div id="who"></div>
</header>
<div id="wrap"><nav id="nav"></nav><main id="main"></main><aside id="side"></aside></div>
<div id="modal"></div><div id="toast"></div>
<noscript><p style="padding:20px">Nestly needs JavaScript.</p></noscript>
<script src="config.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const canStore = (() => { try { localStorage.setItem('tl_t', '1'); localStorage.removeItem('tl_t'); return true; } catch (e) { return false; } })();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

applyTheme(); dark.addEventListener && dark.addEventListener('change', applyTheme);
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; const m = s / 60; if (m < 60) return Math.floor(m) + 'm ago'; const h = m / 60; if (h < 24) return Math.floor(h) + 'h ago'; const d = h / 24; if (d < 30) return Math.floor(d) + 'd ago'; const mo = d / 30; if (mo < 12) return Math.floor(mo) + 'mo ago'; return Math.floor(d / 365) + 'y ago'; };
const fmtN = n => Math.abs(n) >= 10000 ? (n / 1000).toFixed(0) + 'k' : Math.abs(n) >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);

const av = (n, sz = 28) => `<span class="av" style="width:${sz}px;height:${sz}px;background:hsl(${hue(n)},55%,46%);font-size:${Math.round(sz * .5)}px">${esc(String(n)[0].toUpperCase())}</span>`;
const cdot = (n, sz) => `<span class="cdot" style="${sz ? `width:${sz}px;height:${sz}px;` : ''}background:hsl(${hue(n)},55%,46%)">${esc(n[0].toUpperCase())}</span>`;
const NAME = /^[A-Za-z0-9_]{3,20}$/, CNAME = /^[A-Za-z0-9_]{3,21}$/;
function md(s) {
  let t = esc(s);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$1</a>');
  let out = '', list = false;
  for (const ln of t.split('\n')) {
    if (/^\s*[-*] /.test(ln)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + ln.replace(/^\s*[-*] /, '') + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    out += /^&gt; ?/.test(ln) ? '<blockquote>' + ln.replace(/^&gt; ?/, '') + '</blockquote>' : (ln.trim() ? '<p>' + ln + '</p>' : '');

const plain = s => String(s).replace(/[`*>_#]/g, '').replace(/\s+/g, ' ').trim();
const BAD = /\b(fuck\w*|shit\w*|bitch\w*|asshole|bastard|cunt|slut|whore|nigg\w+|fag\w*|retard\w*|porn\w*|nudes?)\b/i;
const clean = (...t) => !ST.filter || !t.some(x => BAD.test(x || ''));
const FRIENDLY = 'Please keep it friendly: that contains a word that is not allowed here.';
const okUrl = u => /^https?:\/\//i.test(u || '');

function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="ov"><div class="box" role="dialog" aria-modal="true">${html}</div></div>`; m.classList.add('on'); const f = $('input,textarea,select', m); if (f) setTimeout(() => f.focus(), 30); }

function ask(msg, ok = 'OK') { return new Promise(res => { modal(`<h3>${esc(msg)}</h3><div class="btns"><button class="btn ghost" id="mNo">Cancel</button><button class="btn danger" id="mYes">${esc(ok)}</button></div>`); $('#mNo').onclick = () => { closeModal(); res(false); }; $('#mYes').onclick = () => { closeModal(); res(true); }; }); }
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('That file is not a picture'));
      im.onload = () => {
        let max = 1000, q = .72;
        for (let i = 0; i < 4; i++) {
          const sc = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');

          const d = c.toDataURL('image/jpeg', q);
          if (d.length < 380000 || i === 3) return res(d);
          max *= .75; q -= .08;
        }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });

    return D.posts.filter(p => (!o.community || p.community === o.community) && (!o.communities || o.communities.includes(p.community)) && (!o.author || p.author === o.author) && (!o.ids || o.ids.includes(p.id)) && (!q || (p.title + ' ' + p.body).toLowerCase().includes(q))).map(p => decP(p, T, cc, sv)).sort((a, b) => b.created - a.created);
  };
  const dropComments = ids => { D.comments = D.comments.filter(c => !ids.includes(c.id)); ids.forEach(id => delete D.votes[me() + '|c|' + id]); for (const k in D.votes) { const s = k.split('|'); if (s[1] === 'c' && ids.includes(+s[2])) delete D.votes[k]; } };
  return {
    kind: 'local',

    async signUp(u, p) {

      if (findUser(u) || SEED_P.some(x => x[1].toLowerCase() === u.toLowerCase())) throw new Error('That username is already taken');

    async signIn(u, p) { const k = findUser(u); if (!k || D.users[k].pw !== hash(p)) throw new Error('Wrong username or password'); D.session = k; save(); },
    async signOut() { D.session = null; save(); },
    async communities() { return Object.values(D.communities).map(c => ({ name: c.name, title: c.title, desc: c.desc, creator: c.creator, created: c.created, members: c.mem + Object.values(D.members).filter(a => a.includes(c.name)).length })).sort((a, b) => b.members - a.members); },
    async joined() { return me() ? (D.members[me()] || []).slice() : []; },
    async createCommunity(n, t, d) {

      D.communities[n] = { name: n, title: t || n, desc: d || '', creator: me(), created: Date.now(), mem: 0 }; (D.members[me()] = D.members[me()] || []).push(n); save();
    },
    async join(n) { needLogin(); const a = D.members[me()] = D.members[me()] || []; if (!a.includes(n)) a.push(n); save(); },
    async leave(n) { needLogin(); D.members[me()] = (D.members[me()] || []).filter(x => x !== n); save(); },
    posts,
    async savedIds() { return (D.saved[me()] || []).slice(); },
    async addPost(p) {
      needLogin(); const id = D.nid++;
      D.posts.push({ id, community: p.community, author: me(), title: p.title, body: p.body || '', url: p.url || '', image: p.image || '', created: Date.now(), base: 0 });
      D.votes[me() + '|p|' + id] = 1; save(); return id;
    },
    async delPost(id) { D.posts = D.posts.filter(p => p.id !== id); dropComments(D.comments.filter(c => c.post === id).map(c => c.id)); for (const k in D.votes) { const s = k.split('|'); if (s[1] === 'p' && +s[2] === id) delete D.votes[k]; } for (const u in D.saved) D.saved[u] = D.saved[u].filter(x => x !== id); save(); },
    async comments(pid) { const T = tally(); return D.comments.filter(c => c.post === pid).map(c => decC(c, T)); },
    async addComment(pid, parent, body) { needLogin(); const id = D.nid++; D.comments.push({ id, post: pid, parent: parent || 0, author: me(), body, created: Date.now(), base: 0 }); D.votes[me() + '|c|' + id] = 1; save(); },
    async delComment(id) { const all = [id]; for (let i = 0; i < all.length; i++) D.comments.forEach(c => { if (c.parent === all[i] && !all.includes(c.id)) all.push(c.id); }); dropComments(all); save(); },
    async vote(kind, id, v) { needLogin(); const k = me() + '|' + kind + '|' + id; if (v === 0) delete D.votes[k]; else D.votes[k] = v; save(); },
    async save(id, on) { needLogin(); const a = D.saved[me()] = D.saved[me()] || []; const i = a.indexOf(id); if (on && i < 0) a.push(id); if (!on && i >= 0) a.splice(i, 1); save(); },
    async report(kind, id, reason) { needLogin(); D.reports.push({ by: me(), kind, id, reason, at: Date.now() }); save(); },
    async userInfo(n) {
      const T = tally(), cc = {}, ps = D.posts.filter(p => p.author === n), cs = D.comments.filter(c => c.author === n), u = D.users[n];
      if (!u && !ps.length && !cs.length) return null;
      const karma = ps.reduce((s, p) => s + p.base + (T['p' + p.id] || 0), 0) + cs.reduce((s, c) => s + c.base + (T['c' + c.id] || 0), 0);
      return { name: n, karma, created: u ? u.created : Math.min(...ps.map(p => p.created), ...cs.map(c => c.created)), posts: ps.length, comments: cs.length };
    },
    async userComments(n) { const T = tally(); return D.comments.filter(c => c.author === n).map(c => { const p = D.posts.find(x => x.id === c.post) || {}; return Object.assign(decC(c, T), { postTitle: p.title || '', community: p.community || '' }); }).sort((a, b) => b.created - a.created); },
    reset() { store.del('tl_db'); }
  };
  function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h); }
})();

/* ---------- data layer 2: Remote (your own free Supabase server, shared by everyone) ---------- */
const Remote = (() => {
  const U = () => ST.server.url.replace(/\/+$/, ''), K = () => ST.server.key;
  let S = store.get('tl_sess', null); // { access, refresh, exp, uid, username }
  const enc = encodeURIComponent, Q = s => String(s).replace(/[,()*%\\"]/g, ' ');
  const kindName = k => k === 'p' ? 'post' : 'comment';
  const mail = u => u.toLowerCase() + '@nestly-app.com';
  async function raw(path, { method = 'GET', body, prefer, token } = {}) {
    const r = await fetch(U() + path, { method, headers: Object.assign({ apikey: K(), Authorization: 'Bearer ' + (token || K()), 'Content-Type': 'application/json' }, prefer ? { Prefer: prefer } : {}), body: body === undefined ? undefined : JSON.stringify(body) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) throw new Error((j && (j.message || j.msg || j.error_description || j.error)) || ('Server error ' + r.status));
    return j;
  }
  async function refresh() { const j = await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: S.refresh } }); setSess(j, S.username); }
  function setSess(j, username) { S = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, uid: j.user.id, username }; store.set('tl_sess', S); }
  async function api(path, o = {}) {
    let token = K();
    if (S) { if (Date.now() > S.exp - 60000) { try { await refresh(); } catch (e) { S = null; store.del('tl_sess'); } } if (S) token = S.access; }
    return raw(path, Object.assign({ token }, o));
  }
  const need = () => { if (!S) throw new Error('Please log in first'); };
  const T = t => Date.parse(t) || Date.now();
  const mapP = r => ({ id: r.id, community: r.community, author: r.author, title: r.title, body: r.body || '', url: r.url || '', image: r.image || '', created: T(r.created), score: r.score || 0, comments: r.comments || 0, myVote: 0, saved: false });
  const mapC = r => ({ id: r.id, post_id: r.post_id, parent_id: r.parent_id || 0, author: r.author, body: r.body, created: T(r.created), score: r.score || 0, myVote: 0 });
  async function myVotes(kind, ids) { if (!S || !ids.length) return {}; const rows = await api('/rest/v1/votes?kind=eq.' + kindName(kind) + '&target=in.(' + ids.join(',') + ')&select=target,value'); const m = {}; rows.forEach(r => m[r.target] = r.value); return m; }
  return {
    kind: 'remote',
    async me() { return S ? { username: S.username, id: S.uid } : null; },
    async signUp(u, p) {
      if (!NAME.test(u)) throw new Error('Username: 3 to 20 letters, numbers or _');
      if (p.length < 6) throw new Error('Password must be at least 6 characters');
      const j = await raw('/auth/v1/signup', { method: 'POST', body: { email: mail(u), password: p } });
      if (!j || !j.access_token) throw new Error('Sign-up needs "Confirm email" switched OFF in Supabase (Authentication > Providers > Email).');
      setSess(j, u);
      try { await api('/rest/v1/profiles', { method: 'POST', body: { id: S.uid, username: u } }); } catch (e) { S = null; store.del('tl_sess'); throw new Error(/duplicate|unique/i.test(e.message) ? 'That username is already taken' : e.message); }
    },
    async signIn(u, p) {
      const j = await raw('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: mail(u), password: p } }).catch(e => { throw new Error(/invalid/i.test(e.message) ? 'Wrong username or password' : e.message); });
      const rows = await raw('/rest/v1/profiles?id=eq.' + j.user.id + '&select=username', { token: j.access_token });
      if (!rows.length) throw new Error('This account has no profile yet');
      setSess(j, rows[0].username);
    },
    async signOut() { S = null; store.del('tl_sess'); },
    async communities() { const rows = await api('/rest/v1/communities_v?select=*&order=members.desc&limit=500'); return rows.map(r => ({ name: r.name, title: r.title, desc: r.description || '', creator: r.creator, created: T(r.created), members: r.members || 0 })); },
    async joined() { if (!S) return []; return (await api('/rest/v1/members?user_id=eq.' + S.uid + '&select=community')).map(r => r.community); },
    async createCommunity(n, t, d) {
      need(); if (!CNAME.test(n)) throw new Error('Community name: 3 to 21 letters, numbers or _');
      await api('/rest/v1/communities', { method: 'POST', body: { name: n, title: t || n, description: d || '', creator: S.uid } }).catch(e => { throw new Error(/duplicate|unique/i.test(e.message) ? 'That community already exists' : e.message); });

    },
    async join(n) { need(); await api('/rest/v1/members?on_conflict=user_id,community', { method: 'POST', prefer: 'resolution=ignore-duplicates', body: { user_id: S.uid, community: n } }); },
    async leave(n) { need(); await api('/rest/v1/members?user_id=eq.' + S.uid + '&community=eq.' + enc(n), { method: 'DELETE' }); },
    async posts(o = {}) {
      let q = '/rest/v1/posts_v?select=*&order=created.desc&limit=300';
      if (o.community) q += '&community=eq.' + enc(o.community);
      if (o.communities) { if (!o.communities.length) return []; q += '&community=in.(' + o.communities.map(enc).join(',') + ')'; }

      if (o.ids) { if (!o.ids.length) return []; q += '&id=in.(' + o.ids.join(',') + ')'; }
      if (o.q) { const s = enc(Q(o.q).trim()); q += '&or=(title.ilike.*' + s + '*,body.ilike.*' + s + '*)'; }
      const L = (await api(q)).map(mapP), ids = L.map(p => p.id);
      if (S && ids.length) {
        const [mv, sv] = await Promise.all([myVotes('p', ids), api('/rest/v1/saved?post_id=in.(' + ids.join(',') + ')&select=post_id')]);
        const ss = new Set(sv.map(r => r.post_id)); L.forEach(p => { p.myVote = mv[p.id] || 0; p.saved = ss.has(p.id); });

    },
    async savedIds() { if (!S) return []; return (await api('/rest/v1/saved?select=post_id&order=created.desc&limit=300')).map(r => r.post_id); },
    async addPost(p) {
      need();
      const r = await api('/rest/v1/posts', { method: 'POST', prefer: 'return=representation', body: { community: p.community, author: S.uid, title: p.title, body: p.body || '', url: p.url || '', image: p.image || '' } });
      const id = r[0].id; try { await this.vote('p', id, 1); } catch (e) {} return id;
    },
    async delPost(id) { await api('/rest/v1/posts?id=eq.' + id, { method: 'DELETE' }); },
    async comments(pid) {
      const L = (await api('/rest/v1/comments_v?post_id=eq.' + pid + '&order=created.asc&limit=1000')).map(mapC);
      const mv = await myVotes('c', L.map(c => c.id)); L.forEach(c => c.myVote = mv[c.id] || 0); return L;
    },
    async addComment(pid, parent, body) {
      need(); const r = await api('/rest/v1/comments', { method: 'POST', prefer: 'return=representation', body: { post_id: pid, parent_id: parent || null, author: S.uid, body } });
      try { await this.vote('c', r[0].id, 1); } catch (e) {}
    },
    async delComment(id) { await api('/rest/v1/comments?id=eq.' + id, { method: 'DELETE' }); },
    async vote(kind, id, v) {
      need();
      if (v === 0) await api('/rest/v1/votes?user_id=eq.' + S.uid + '&kind=eq.' + kindName(kind) + '&target=eq.' + id, { method: 'DELETE' });
      else await api('/rest/v1/votes?on_conflict=user_id,kind,target', { method: 'POST', prefer: 'resolution=merge-duplicates', body: { user_id: S.uid, kind: kindName(kind), target: id, value: v } });
    },
    async save(id, on) {
      need();
      if (on) await api('/rest/v1/saved?on_conflict=user_id,post_id', { method: 'POST', prefer: 'resolution=ignore-duplicates', body: { user_id: S.uid, post_id: id } });
      else await api('/rest/v1/saved?user_id=eq.' + S.uid + '&post_id=eq.' + id, { method: 'DELETE' });
    },
    async report(kind, id, reason) { need(); await api('/rest/v1/reports', { method: 'POST', body: { user_id: S.uid, kind: kindName(kind), target: id, reason } }); },
    async userInfo(n) {
      const pr = await api('/rest/v1/profiles?username=eq.' + enc(n) + '&select=username,created'); if (!pr.length) return null;
      const [ps, cs] = await Promise.all([api('/rest/v1/posts_v?author=eq.' + enc(n) + '&select=score&limit=1000'), api('/rest/v1/comments_v?author=eq.' + enc(n) + '&select=score&limit=1000')]);
      return { name: pr[0].username, karma: ps.reduce((s, r) => s + (r.score || 0), 0) + cs.reduce((s, r) => s + (r.score || 0), 0), created: T(pr[0].created), posts: ps.length, comments: cs.length };

    async userComments(n) {

    },
    async ping(url, key) { // used by Settings to test a server before switching to it
      const r = await fetch(url.replace(/\/+$/, '') + '/rest/v1/communities_v?select=name&limit=1', { headers: { apikey: key, Authorization: 'Bearer ' + key } });

function commentTree(list) {
  const by = {}; list.forEach(c => (by[c.parent_id || 0] = by[c.parent_id || 0] || []).push(c));
  Object.values(by).forEach(a => a.sort((x, y) => y.score - x.score || x.created - y.created));
  const ids = new Set(list.map(c => c.id)), roots = list.filter(c => c.parent_id && !ids.has(c.parent_id)); // orphans show at the top level
  (by[0] = by[0] || []).push(...roots);
  const mp = CUR ? isMod(CUR.post.community) : false;
  const one = (c, depth) => `<div class="cm" id="c${c.id}"><div class="cvote" data-vk="c" data-id="${c.id}" data-my="${c.myVote}"><button class="up" data-act="vote" data-v="1" aria-label="Upvote">▲</button><span class="sc" data-s="${c.score}">${fmtN(c.score)}</span><button class="down" data-act="vote" data-v="-1" aria-label="Downvote">▼</button></div>
    <div class="cmain"><div class="cmeta">${av(c.author, 20)}<a class="u" href="#/u/${esc(c.author)}">u/${esc(c.author)}</a><span>·</span><span>${ago(c.created)}</span><button data-act="fold" class="hint" aria-label="Collapse">[–]</button></div>
    <div class="cbody body">${md(c.body)}</div><div class="cact"><button data-act="reply" data-id="${c.id}">Reply</button>${ME && (ME.username === c.author || mp) ? `<button data-act="delcm" data-id="${c.id}">Delete</button>` : ''}${ME && ME.username !== c.author ? `<button data-act="report" data-k="c" data-id="${c.id}">Report</button>` : ''}</div>
    <div class="reply"></div><div class="kids ${depth >= 5 ? 'flat' : ''}">${(by[c.id] || []).map(k => one(k, depth + 1)).join('')}</div></div></div>`;
  return (by[0] || []).map(c => one(c, 0)).join('');
}

/* ---------- router ---------- */
async function route() {
  const rid = ++routeId, h = location.hash || '#/'; let m;
  document.title = 'Nestly';
  try {
    if (h === '#/' || h === '#') await viewHome(rid);
    else if (h === '#/popular') await viewPopular(rid);
    else if (h === '#/saved') await viewSaved(rid);
    else if ((m = h.match(/^#\/c\/(\w+)$/))) await viewCommunity(m[1], rid);
    else if ((m = h.match(/^#\/post\/(\d+)$/))) await viewPost(+m[1], rid);
    else if ((m = h.match(/^#\/u\/(\w+)(?:\/(comments))?$/))) await viewUser(m[1], m[2], rid);
    else if ((m = h.match(/^#\/search\/(.*)$/))) await viewSearch(decodeURIComponent(m[1]), rid);
    else if (h.startsWith('#/submit')) viewSubmit();
    else if (h === '#/new-community') viewNewCommunity();
    else if (h === '#/settings') viewSettings();
    else notFound();
  } catch (er) {
    if (rid === routeId) main.innerHTML = `<div class="card"><h3>Something went wrong</h3><p class="muted">${esc(er.message || er)}</p><button class="btn" data-act="refresh">Try again</button></div>`;
  }
  paintNav();
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); route(); });
(async function start() {
  try { await loadMeta(); } catch (e) { toast('Could not reach the server: ' + e.message); }
  route();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script></body></html>
